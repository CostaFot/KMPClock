name: Publish Release

on:
  workflow_dispatch:

jobs:
  compute-tag:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute tag
        id: tag
        run: echo "value=v1.0.$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

  windows:
    needs: compute-tag
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build app distributable
        run: ./gradlew :composeApp:createReleaseDistributable

      - name: Build installer with Inno Setup
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
        shell: pwsh

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer-output/DogeClock-Setup.exe

  linux:
    needs: compute-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Linux deb
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:packageReleaseDeb

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: composeApp/build/compose/binaries/main-release/deb/*.deb

  release:
    needs: [compute-tag, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.compute-tag.outputs.value }}
          name: ${{ needs.compute-tag.outputs.value }}
          files: |
            windows-installer/DogeClock-Setup.exe
            linux-deb/*.deb
          generate_release_notes: true
