name: Publish Windows Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Compute tag
        id: tag
        shell: bash
        run: echo "value=v1.0.$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - name: Build Windows exe
        run: ./gradlew :composeApp:packageReleaseExe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          files: composeApp/build/compose/binaries/main-release/exe/*.exe
          generate_release_notes: true
